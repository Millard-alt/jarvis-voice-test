name: opencode-task

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task prompt'
        required: true
        type: string
      model:
        description: 'Model (provider/model)'
        required: false
        type: string
        default: 'google/gemini-2.5-flash'
      channel_id:
        description: 'Discord channel to report to'
        required: false
        type: string
        default: ''

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ inputs.model || 'google/gemini-2.5-flash' }}
          prompt: ${{ inputs.prompt }}
          use_github_token: true

      - name: Report to Discord
        if: ${{ inputs.channel_id != '' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          REPO: ${{ github.repository }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          node -e '
          const token = process.env.DISCORD_TOKEN;
          const channelId = process.env.CHANNEL_ID;
          const repo = process.env.REPO;
          const [owner, name] = repo.split("/");
          (async () => {
            // Find the most recent open PR
            const r = await fetch(`https://api.github.com/repos/${owner}/${name}/pulls?state=open&sort=created&direction=desc&per_page=1`, {
              headers: { "Accept": "application/vnd.github+json", "User-Agent": "jarvis-worker" },
            });
            const prs = await r.json();
            const prUrl = (prs && prs[0] && prs[0].html_url) ? prs[0].html_url : "(no PR found)";
            const msg = "Task finished.\nPrompt: " + process.env.PROMPT + "\nPR: " + prUrl;
            const m = await fetch("https://discord.com/api/v10/channels/" + channelId + "/messages", {
              method: "POST",
              headers: { "Authorization": "Bot " + token, "Content-Type": "application/json" },
              body: JSON.stringify({ content: msg }),
            });
            if (!m.ok) { console.error("report failed", m.status, await m.text()); process.exit(1); }
            console.log("Report sent");
          })().catch(e => { console.error(e); process.exit(1); });
          '
