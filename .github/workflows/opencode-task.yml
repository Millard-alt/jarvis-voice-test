name: opencode-task

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task prompt'
        required: true
        type: string
      model:
        description: 'Model (provider/model)'
        required: false
        type: string
        default: 'github/gpt-4o-mini'
      channel_id:
        description: 'Discord channel to report to'
        required: false
        type: string
        default: ''

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Notify start
        if: ${{ inputs.channel_id != '' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id }}
        run: |
          node -e '
          const token=process.env.DISCORD_TOKEN; const ch=process.env.CHANNEL_ID;
          fetch("https://discord.com/api/v10/channels/"+ch+"/messages",{method:"POST",headers:{"Authorization":"Bot "+token,"Content-Type":"application/json"},body:JSON.stringify({content:"Task started. Working on it..."})})
          .then(r=>r.ok?console.log("start notified"):console.error("notify failed",r.status))
          .catch(e=>console.error(e));
          '

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - name: Run OpenCode
        timeout-minutes: 12
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CI: "true"
          FORCE_COLOR: "0"
          NO_COLOR: "1"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_PERMISSION: '{"permissions":[{"action":"read","resource":"*.env","effect":"deny"},{"action":"read","resource":"*.env.*","effect":"deny"},{"action":"shell","resource":"git push *","effect":"deny"}]}'
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "PATH=$PATH"
          which opencode || echo "opencode not found"
          opencode --version || true
          export LOG_FILE=/tmp/opencode.log
          export DONE_FILE=/tmp/opencode.done
          export LOGS_CHANNEL=1568947421801619557
          rm -f /tmp/opencode.log /tmp/opencode.done
          echo "Starting opencode..." > /tmp/opencode.log
          node scripts/log-watcher.js &
          WATCHER_PID=$!
          timeout -k 30 540 opencode run --auto --model "${{ inputs.model || 'github/gpt-4o-mini' }}" "${{ github.event.inputs.task }}" >> /tmp/opencode.log 2>&1
          OPENCODE_EXIT=$?
          touch /tmp/opencode.done
          wait $WATCHER_PID
          exit $OPENCODE_EXIT

      - name: Create pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="opencode/$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "NO_PR=true" >> $GITHUB_ENV
            exit 0
          fi
          git commit -m "opencode: ${{ inputs.task }}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "opencode: ${{ inputs.task }}" --body "Automated change by opencode." --head "$BRANCH" --base main)
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Report to Discord
        if: ${{ always() && inputs.channel_id != '' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PR_URL: ${{ env.PR_URL }}
          TASK: ${{ inputs.task }}
        run: |
          node -e '
          const token=process.env.DISCORD_TOKEN; const ch=process.env.CHANNEL_ID;
          const pr=process.env.PR_URL || "(no PR created)";
          const msg="Task finished.\nPrompt: "+process.env.TASK+"\nPR: "+pr;
          fetch("https://discord.com/api/v10/channels/"+ch+"/messages",{method:"POST",headers:{"Authorization":"Bot "+token,"Content-Type":"application/json"},body:JSON.stringify({content:msg})})
          .then(r=>r.ok?console.log("report sent"):console.error("report failed",r.status))
          .catch(e=>console.error(e));
          '

      - name: Post AI response
        if: ${{ always() && inputs.channel_id != '' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RESPONSE_CHANNEL: "1568926056545517602"
        run: |
          node -e '
          const fs=require("fs");
          const token=process.env.DISCORD_TOKEN; const ch=process.env.RESPONSE_CHANNEL;
          let log=""; try { log=fs.readFileSync("/tmp/opencode.log","utf8"); } catch(e){}
          const tail=log.slice(-1900);
          fetch("https://discord.com/api/v10/channels/"+ch+"/messages",{method:"POST",headers:{"Authorization":"Bot "+token,"Content-Type":"application/json"},body:JSON.stringify({content:tail||"(no output)"})})
          .then(r=>r.ok?console.log("response posted"):console.error("post failed",r.status))
          .catch(e=>console.error(e));
          '
