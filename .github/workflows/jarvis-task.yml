name: jarvis-task

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task prompt'
        required: true
        type: string

jobs:
  jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - name: Run OpenCode
        timeout-minutes: 10
        env:
          CI: "true"
          FORCE_COLOR: "0"
          NO_COLOR: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          
          # Extract task input or fallback to a default test string
          TASK_PROMPT="${{ inputs.task || github.event.inputs.task }}"
          if [ -z "$TASK_PROMPT" ]; then
            TASK_PROMPT="Add a test comment to verify non-interactive execution"
          fi

          # Run non-interactively using OpenRouter (free tier) and plain text output
          opencode run --model "openrouter/nvidia/nemotron-3.5-super-vl:free" --auto "$TASK_PROMPT"

      - name: Create branch and PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="jarvis/task-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "" > /tmp/jarvis_pr_url
            exit 0
          fi
          git commit -m "jarvis: ${{ inputs.task }}"
          git push origin "$BRANCH"
          # Create PR via GitHub REST API (works without 'gh' CLI)
          PR_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -d "{\"title\":\"jarvis: ${{ inputs.task }}\",\"head\":\"${BRANCH}\",\"base\":\"main\",\"body\":\"Automated change by Jarvis.\"}")
          HTTP_CODE=$(echo "$PR_RESPONSE" | tail -n1)
          PR_BODY=$(echo "$PR_RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "201" ]; then
            PR_URL=$(echo "$PR_BODY" | grep -o '"html_url": "[^"]*' | sed 's/"html_url": "//')
            echo "$PR_URL" > /tmp/jarvis_pr_url
          else
            echo "PR create failed (HTTP $HTTP_CODE): $PR_BODY" >&2
            echo "" > /tmp/jarvis_pr_url
          fi

      - name: Report back to Discord
        if: always()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          USER_ID: "1270343449643843736"
          TASK: ${{ inputs.task }}
          JOB_STATUS: ${{ job.status }}
        run: |
          PR_URL=$(cat /tmp/jarvis_pr_url 2>/dev/null || echo "")
          node -e '
          const token = process.env.DISCORD_BOT_TOKEN;
          const userId = process.env.USER_ID;
          const pr = process.argv[1] || "(no PR created)";
          (async () => {
            const r = await fetch("https://discord.com/api/v10/users/@me/channels", {
              method: "POST",
              headers: { "Authorization": "Bot " + token, "Content-Type": "application/json" },
              body: JSON.stringify({ recipient_id: userId }),
            });
            if (!r.ok) { console.error("DM channel failed", r.status, await r.text()); process.exit(1); }
            const ch = await r.json();
            const msg = "Task finished.\nPrompt: " + process.env.TASK + "\nStatus: " + process.env.JOB_STATUS + "\nPR: " + pr;
            const m = await fetch("https://discord.com/api/v10/channels/" + ch.id + "/messages", {
              method: "POST",
              headers: { "Authorization": "Bot " + token, "Content-Type": "application/json" },
              body: JSON.stringify({ content: msg }),
            });
            if (!m.ok) { console.error("message send failed", m.status, await m.text()); process.exit(1); }
            console.log("Report sent to DM.");
          })().catch(e => { console.error(e); process.exit(1); });
          ' "$PR_URL"